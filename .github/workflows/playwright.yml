name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test (blank = repo variable or saucedemo)'
        required: false
        type: string
      api_url:
        description: 'API URL for tests/api (blank = repo variable or restful-booker)'
        required: false
        type: string
      browser:
        description: 'Browser(s) for Playwright + BDD'
        required: false
        type: choice
        default: all
        options: [all, chromium, firefox, webkit]
      cucumber_browser:
        description: 'Browser for Cucumber'
        required: false
        type: choice
        default: chromium
        options: [chromium, firefox, webkit]
      tags:
        description: 'Tag(s) to run, e.g. @smoke,@login (blank = all)'
        required: false
        type: string
      sauce_username:
        description: 'Login username (blank = secret or standard_user)'
        required: false
        type: string
      sauce_password:
        description: 'Login password (blank = secret or secret_sauce). Visible to anyone who can see the run: use only for test accounts'
        required: false
        type: string

# CI has no .env file (it is gitignored), so set the same values here.
# Priority: manual-run input > repo variable/secret (Settings > Secrets and variables > Actions) > default.
# On push/PR runs the inputs are empty, so the later values apply.
env:
  BASE_URL: ${{ inputs.base_url || vars.BASE_URL || 'https://www.saucedemo.com/' }}
  API_URL: ${{ inputs.api_url || vars.API_URL || 'https://restful-booker.herokuapp.com' }}
  SAUCE_USERNAME: ${{ inputs.sauce_username || secrets.SAUCE_USERNAME || 'standard_user' }}
  # Inputs are not secret: anyone who can see the run can see a typed password
  SAUCE_PASSWORD: ${{ inputs.sauce_password || secrets.SAUCE_PASSWORD || 'secret_sauce' }}
  BROWSER: ${{ inputs.browser || vars.BROWSER || 'all' }}
  TAGS: ${{ inputs.tags || vars.TAGS || 'all' }}

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # Allure history: restore the newest saved copy, so the report shows trends across runs
    - name: Restore Allure history
      uses: actions/cache/restore@v4
      with:
        path: allure-history.jsonl
        key: allure-history-playwright-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          allure-history-playwright-${{ github.ref_name }}-
          allure-history-playwright-
    - name: Run Playwright tests
      # API tests run in the api job below
      run: npx playwright test
      env:
        SKIP_API: 'true'
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Run BDD tests
      if: ${{ !cancelled() }}
      run: npm run test:bdd
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: bdd-report
        path: playwright-report/
        retention-days: 30
    # Playwright and BDD runs both write to allure-results/, so this is one combined report
    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: npm run allure:generate
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
    # Each run saves under its own key (caches can't be overwritten); old ones expire after 7 days unused
    - name: Save Allure history
      if: ${{ !cancelled() && hashFiles('allure-history.jsonl') != '' }}
      uses: actions/cache/save@v4
      with:
        path: allure-history.jsonl
        key: allure-history-playwright-${{ github.ref_name }}-${{ github.run_id }}

  api:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    # No browser install: API tests only use the request fixture
    # Allure history: restore the newest saved copy, so the report shows trends across runs
    - name: Restore Allure history
      uses: actions/cache/restore@v4
      with:
        path: allure-history.jsonl
        key: allure-history-api-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          allure-history-api-${{ github.ref_name }}-
          allure-history-api-
    - name: Run API tests
      # TAGS like @login match no API tests; don't fail the job for that
      run: npm run test:api -- --pass-with-no-tests
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: api-report
        path: playwright-report/
        retention-days: 30
    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: npm run allure:generate
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: api-allure-report
        path: allure-report/
        retention-days: 30
    # Each run saves under its own key (caches can't be overwritten); old ones expire after 7 days unused
    - name: Save Allure history
      if: ${{ !cancelled() && hashFiles('allure-history.jsonl') != '' }}
      uses: actions/cache/save@v4
      with:
        path: allure-history.jsonl
        key: allure-history-api-${{ github.ref_name }}-${{ github.run_id }}

  cucumber:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cucumber
    env:
      # cucumber runs one browser per run; "all" falls back to chromium
      BROWSER: ${{ inputs.cucumber_browser || vars.CUCUMBER_BROWSER || 'chromium' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: |
          package-lock.json
          cucumber/package-lock.json
    # The shared page objects (../pages) import allure-js-commons, which Node resolves from the root node_modules
    - name: Install root dependencies
      working-directory: .
      run: npm ci
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ env.BROWSER }}
    # Allure history: restore the newest saved copy, so the report shows trends across runs
    - name: Restore Allure history
      uses: actions/cache/restore@v4
      with:
        path: cucumber/reports/allure-history.jsonl
        key: allure-history-cucumber-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          allure-history-cucumber-${{ github.ref_name }}-
          allure-history-cucumber-
    - name: Run Cucumber tests
      run: npm test
    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: npm run allure:generate
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: cucumber-report
        path: cucumber/reports/
        retention-days: 30
    # Each run saves under its own key (caches can't be overwritten); old ones expire after 7 days unused
    - name: Save Allure history
      if: ${{ !cancelled() && hashFiles('cucumber/reports/allure-history.jsonl') != '' }}
      uses: actions/cache/save@v4
      with:
        path: cucumber/reports/allure-history.jsonl
        key: allure-history-cucumber-${{ github.ref_name }}-${{ github.run_id }}
