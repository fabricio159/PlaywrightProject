name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# CI has no .env file (it is gitignored), so set the same values here.
# Override them in GitHub: Settings > Secrets and variables > Actions.
env:
  BASE_URL: ${{ vars.BASE_URL || 'https://www.saucedemo.com/' }}
  SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME || 'standard_user' }}
  SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD || 'secret_sauce' }}
  BROWSER: ${{ vars.BROWSER || 'all' }}

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Run BDD tests
      if: ${{ !cancelled() }}
      run: npm run test:bdd
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: bdd-report
        path: playwright-report/
        retention-days: 30

  cucumber:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cucumber
    env:
      # cucumber runs one browser per run; "all" falls back to chromium
      BROWSER: ${{ vars.CUCUMBER_BROWSER || 'chromium' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: cucumber/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ env.BROWSER }}
    - name: Run Cucumber tests
      run: npm test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: cucumber-report
        path: cucumber/reports/
        retention-days: 30
